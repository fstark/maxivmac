name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

env:
  # Override these via GitHub repository/environment Variables (Settings -> Secrets and variables -> Actions).
  # Set to 'false' to disable.
  CI_ENABLED: ${{ vars.CI_ENABLED || 'true' }}
  CI_LINUX_ENABLED: ${{ vars.CI_LINUX_ENABLED || 'true' }}
  CI_MACOS_ENABLED: ${{ vars.CI_MACOS_ENABLED || 'true' }}
  CI_WINDOWS_ENABLED: ${{ vars.CI_WINDOWS_ENABLED || 'true' }}

jobs:
  build-linux:
    if: env.CI_ENABLED == 'true' && env.CI_LINUX_ENABLED == 'true'
    runs-on: ubuntu-24.04
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0  # full history for git describe

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          cmake ninja-build \
          libx11-dev libxext-dev libxrandr-dev libxcursor-dev \
          libxi-dev libxinerama-dev libxss-dev \
          libgl-dev libgles-dev libegl-dev \
          libwayland-dev libxkbcommon-dev wayland-protocols \
          libasound2-dev libpulse-dev libpipewire-0.3-dev \
          libdbus-1-dev libdecor-0-dev

    - name: Build SDL3 from source
      run: |
        git clone --depth 1 --branch release-3.2.14 https://github.com/libsdl-org/SDL.git /tmp/SDL3
        cmake -S /tmp/SDL3 -B /tmp/SDL3/build -G Ninja \
          -DCMAKE_BUILD_TYPE=Release \
          -DCMAKE_INSTALL_PREFIX=/usr/local
        cmake --build /tmp/SDL3/build
        sudo cmake --install /tmp/SDL3/build

    - name: Configure
      run: cmake --preset linux

    - name: Build
      run: cmake --build --preset linux -- -k 0

    - name: Unit tests
      run: ctest --test-dir bld/linux --output-on-failure

    - name: Golden tests
      run: EMU=./bld/linux/maxivmac ./test/verify.sh

  build-macos:
    if: env.CI_ENABLED == 'true' && env.CI_MACOS_ENABLED == 'true'
    runs-on: macos-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Install dependencies
      run: brew install ninja sdl3

    - name: Configure
      run: cmake --preset macos

    - name: Build
      run: cmake --build --preset macos -- -k 0

    - name: Unit tests
      run: ctest --test-dir bld/macos --output-on-failure

    - name: Golden tests
      run: EMU=./bld/macos/maxivmac ./test/verify.sh

  build-windows:
    if: env.CI_ENABLED == 'true' && env.CI_WINDOWS_ENABLED == 'true'
    strategy:
      matrix:
        include:
          - runner: windows-latest
            msystem: MINGW64
            pkg-prefix: mingw-w64-x86_64
            preset: windows
          - runner: windows-11-arm
            msystem: CLANGARM64
            pkg-prefix: mingw-w64-clang-aarch64
            preset: windows
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: msys2 {0}
    steps:
    - name: Setup MSYS2
      uses: msys2/setup-msys2@v2
      with:
        msystem: ${{ matrix.msystem }}
        install: >-
          ${{ matrix.pkg-prefix }}-cc
          ${{ matrix.pkg-prefix }}-cmake
          ${{ matrix.pkg-prefix }}-ninja
          ${{ matrix.pkg-prefix }}-sdl3
          git

    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Configure
      run: cmake --preset windows

    - name: Build
      run: cmake --build --preset windows -- -k 0

    - name: Unit tests
      run: ctest --test-dir bld/windows --output-on-failure

    - name: Golden tests
      run: EMU=./bld/windows/maxivmac.exe ./test/verify.sh
